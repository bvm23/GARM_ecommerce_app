<form
  [formGroup]="authForm"
  class="p-4 rounded-lg bg-white shadow-2xl flex flex-col gap-4"
>
  <h1 class="text-2xl font-black mb-6">
    Login<span class="text-blue-600">.</span>
  </h1>
  <div class="flex flex-col">
    <label for="email">Email</label>
    <input
      type="text"
      id="email"
      autocomplete="off"
      formControlName="email"
      class="border outline-0 p-2 min-w-md"
    />
  </div>
  <div class="flex flex-col">
    <label for="password">Password</label>
    <input
      type="text"
      id="password"
      autocomplete="off"
      formControlName="password"
      class="border outline-0 p-2 min-w-md"
    />
  </div>
  <button
    type="submit"
    class="p-2 bg-blue-600 text-white font-bold uppercase rounded-md cursor-pointer"
  >
    login
  </button>

  <div
    class="flex gap-6 justify-center mt-8 mb-2 [&>button]:capitalize [&>button]:cursor-pointer text-gray-700 font-medium"
  >
    <button type="button">create new account</button>
    <button type="button">forgot password</button>
  </div>
</form>
