<form
  [formGroup]="authForm"
  class="p-4 rounded-lg bg-white shadow-2xl flex flex-col gap-4"
  (ngSubmit)="onSubmit()"
>
  <h1 class="text-2xl font-black mb-6">
    Login<span class="text-blue-600">.</span>
  </h1>
  <div class="flex flex-col">
    <label for="email">Email</label>
    <input
      type="text"
      id="email"
      autocomplete="off"
      formControlName="email"
      [ngClass]="{
        'border outline-0 p-2 min-w-md': true,
        'border-red-500': isInvalidControl('email')
      }"
    />
  </div>
  <div class="flex flex-col">
    <label for="password">Password</label>
    <input
      type="text"
      id="password"
      autocomplete="off"
      formControlName="password"
      [ngClass]="{
        'border outline-0 p-2 min-w-md': true,
        'border-red-500': isInvalidControl('password')
      }"
    />
  </div>
  <button
    type="submit"
    class="p-2 bg-blue-600 text-white font-bold uppercase rounded-md cursor-pointer"
  >
    login
  </button>

  <div
    class="flex gap-6 justify-center mt-8 mb-2 [&>button]:capitalize [&>button]:cursor-pointer text-gray-500 font-medium"
  >
    <button type="button" class="hover:text-gray-800">
      create new account
    </button>
    <button type="button" class="hover:text-gray-800">forgot password</button>
  </div>
</form>
